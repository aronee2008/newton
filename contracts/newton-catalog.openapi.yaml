openapi: 3.0.3
info:
  title: Newton Catalog API
  version: 1.0.0

paths:
  /api/games:
    get:
      operationId: Games_GetAll
      responses:
        '200':
          description: All games in the catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'

  /api/games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: Games_GetById
      responses:
        '200':
          description: The requested game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: Games_Update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameRequest'
      responses:
        '204':
          description: Updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    GameId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: No game with that id
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: The request body failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'

  schemas:
    Platform:
      type: string
      enum: [Pc, PlayStation4, PlayStation5, XboxOne, XboxSeriesX, NintendoSwitch, Mobile]

    Genre:
      type: string
      enum: [Action, Adventure, Rpg, Shooter, Strategy, Sports, Racing, Puzzle, Simulation, Platformer, Fighting, Horror]

    Game:
      # No extra properties: the generated class is also the EF entity, and an AdditionalProperties dictionary cannot be mapped
      additionalProperties: false
      type: object
      required: [id, title, developer, platform, genre, releaseDate, rating, price]
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 100
        developer:
          type: string
          maxLength: 100
        platform:
          $ref: '#/components/schemas/Platform'
        genre:
          $ref: '#/components/schemas/Genre'
        releaseDate:
          type: string
          format: date
        rating:
          type: integer
        price:
          type: number
          format: decimal

    UpdateGameRequest:
      additionalProperties: false
      type: object
      required: [title, developer, platform, genre, releaseDate, rating, price]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        developer:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: '#/components/schemas/Platform'
        genre:
          $ref: '#/components/schemas/Genre'
        releaseDate:
          type: string
          format: date
        rating:
          type: integer
          minimum: 0
          maximum: 100
        price:
          type: number
          format: decimal
          minimum: 0

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      additionalProperties: true

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
